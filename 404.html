<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Subash Jaganathan</title>
  <meta name="robots" content="noindex" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link href="/assets/fonts/fonts.css" rel="stylesheet" />
  <script src="/404.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f7f8fa; color: #344054; font-family: "Inter", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card { width: min(520px, 100%); background: #fff; border: 1px solid #e4e7ec; border-radius: 16px; padding: 40px; }
    .code { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #0f62fe; }
    h1 { margin-top: 8px; font-size: 32px; letter-spacing: -0.025em; color: #101828; }
    p { margin-top: 12px; line-height: 1.6; color: #5d6779; }
    a.btn { display: inline-block; margin-top: 28px; padding: 11px 18px; border-radius: 8px; background: #0f62fe; color: #fff; font-weight: 600; text-decoration: none; }
    a.btn:hover { background: #0043ce; }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">Error 404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for has been moved, renamed, or never existed.</p>
    <a class="btn" href="/">Back to the homepage</a>
  </main>
</body>
</html>
