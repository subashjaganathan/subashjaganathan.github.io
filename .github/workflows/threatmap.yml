name: Threat map data

# Refreshes assets/data/threatmap.json for the live C2 threat map every six hours from
# abuse.ch ThreatFox (CC0) and IPtoASN (PDDL), commits it, then asks Pages to rebuild.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: threatmap
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build threat map data
        run: python scripts/build_threatmap.py

      - name: Commit and publish if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- assets/data/threatmap.json; then
            echo "No change in threat map data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/threatmap.json
          git commit -m "Threat map: refresh ThreatFox C2 data"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped"
